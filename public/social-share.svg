  <path d="M154 235h46l22-72 38 145 29-83h50" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="410" y="167" fill="#315c3b" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">ExploringNeeds.com</text>
  <text x="410" y="252" fill="#17231b" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900">Name the feeling.</text>
